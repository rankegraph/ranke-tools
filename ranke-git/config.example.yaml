# ranke-git config — an alternative to typing every flag by hand.
#
# Copy this file, fill it in, and pass --config path/to/it.yaml. Any flag given
# on the command line still wins over what's here, so a shared config plus a
# one-off --branch override on the command line works as you'd expect.

server: https://ranke-db.example.com
# One credential; the endpoint rejects two as ambiguous. A macaroon is the one
# carrying caveats.
token: ""
api_key: ""
macaroon: ""

# Omit contributor_id to sign as whichever contributor carries this key.
contributor_id: ""
# A path, or file:path | env:VAR | stdin | prompt — env: is the CI one, since
# the key then never lands on the runner's disk.
signing_key: /path/to/contributor.pem

# Omit to take the checkout's own origin.
repo: https://github.com/acme/widgets.git
# clone: /path/to/an/existing/checkout   # read this instead of cloning `repo`

# Omit to take the repo URL's last segment; name it here for a monorepo's
# several projects.
project: widgets
branch: main

# Monorepo subset — omit entirely to archive the whole tree.
# paths:
#   - services/api
#   - libs/shared
